<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arabcha lugʻat takrori</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#12302f;--mut:#5d7472;--acc:#0f5c58;--acc-t:#fff;--gold:#d9a21b;--ok:#1f8a54;--okb:#dff3e8;--bad:#c13b2a;--badb:#fbe3df;--line:#d5e0de}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1a;--card:#162626;--ink:#e6f0ee;--mut:#93aaa7;--acc:#4cc2b8;--acc-t:#08201e;--gold:#e8b93a;--ok:#5fd394;--okb:#17372a;--bad:#ff8a78;--badb:#3b1d19;--line:#284240}}
:root[data-theme="dark"]{--bg:#0e1a1a;--card:#162626;--ink:#e6f0ee;--mut:#93aaa7;--acc:#4cc2b8;--acc-t:#08201e;--gold:#e8b93a;--ok:#5fd394;--okb:#17372a;--bad:#ff8a78;--badb:#3b1d19;--line:#284240}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip,.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.btn{border-radius:12px;padding:14px;font-size:16px;font-weight:600;width:100%}
.btn.p{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.lab{font-size:13px;color:var(--mut);margin:14px 0 2px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 16px;text-align:center;margin-bottom:12px}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;font-size:44px;line-height:1.5;direction:rtl}
.uz{font-size:26px;font-weight:600}
.meta{font-size:13px;color:var(--mut);margin-top:6px}
.opt{display:block;width:100%;text-align:center;margin:8px 0;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.opt.arb{font-family:"Noto Naskh Arabic","Geeza Pro",serif;font-size:26px;direction:rtl}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--badb);border-color:var(--bad)}
.opt:disabled{cursor:default}
.res{text-align:center;padding:20px 0}
.big{font-size:56px;font-weight:700;color:var(--acc)}
.wl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin:10px 0;text-align:left}
.wl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.wl div:last-child{border:0}
.wl .ar{font-size:24px;line-height:1.3}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.link{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:6px}

main{padding-bottom:88px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:14px 0;cursor:pointer}
#nav button[aria-pressed="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--gold)}
.book,.unit{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;font:inherit;cursor:pointer}
.unit{padding:10px 14px;gap:2px;flex-direction:row;flex-wrap:wrap;justify-content:space-between}
.unit .bar{flex-basis:100%;margin:4px 0 0}
.unit[aria-pressed="true"]{border-color:var(--acc);background:var(--okb)}
.book .ar{font-size:32px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.st b{display:block;font-size:26px;color:var(--acc)}
input#nm{font:inherit;font-size:20px;font-weight:700;width:100%;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink);padding:6px 0;margin-bottom:6px}
.lv{background:var(--acc);color:var(--acc-t);border-radius:16px;padding:16px;margin:10px 0}
.lv .bar{background:rgba(255,255,255,.3)}.lv .bar i{background:var(--gold)}
.pu{font-size:14px;margin:8px 0 0;display:flex;justify-content:space-between}
.fb{text-align:center;color:var(--ok);font-weight:600;min-height:22px}

:root,:root[data-theme]{--bg:#0b1a11;--card:#13271b;--line:#244230;--ink:#eaf5ec;--mut:#8fae99;--acc:#8cf06e;--acc-t:#0b1a11;--gold:#8cf06e;--okb:#1c3a28;--ok:#8cf06e;--no:#ff7a6b;color-scheme:dark}
html,body{background:#0b1a11;color:#eaf5ec}
#nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:26px;padding:6px;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:20px;padding:8px 0;font-size:12px;box-shadow:none!important}
#nav button[aria-pressed="true"]{background:#2a4434;color:#fff}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(145deg,#2f6a38,#16341f);border:1px solid #3d7a45;border-radius:26px;padding:18px;margin:6px 0 14px}
.hr{display:flex;gap:16px;align-items:center}
.av{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;padding:6px}
.av i{width:100%;height:100%;border-radius:50%;background:#0b1a11;display:grid;place-items:center;font:700 34px/1 system-ui;font-style:normal;color:var(--acc)}
.pill{display:inline-block;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;margin:6px 6px 0 0}
.xpt{font-size:14px;color:#cfe6d3;margin-top:8px}
.tri{display:flex;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.tri div{flex:1;text-align:center;font-size:13px;color:#cfe6d3}
.tri b{display:block;font-size:26px;color:#fff}
.c2{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.c2 .k{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--acc)}
.c2 .n{font-size:34px;font-weight:700;margin:4px 0 10px}
.c2 .n small{font-size:15px;color:var(--mut);font-weight:500}
.h2{font-weight:700;color:var(--mut);margin:20px 4px 8px}
.bds{display:flex;gap:10px;align-items:center;overflow-x:auto}
.bd{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#1b3226;color:#4d6b57}
.bd.on{background:var(--acc);color:var(--acc-t)}
.lvs{display:flex;gap:6px;margin-top:12px}
.lvs span{flex:1;text-align:center;padding:8px 0;border-radius:999px;background:#1b3226;color:var(--mut);font-weight:700;font-size:14px}
.lvs span.on{background:var(--acc);color:var(--acc-t)}
.opt.sel{border-color:var(--acc)!important;background:var(--okb)!important;color:var(--ink)}</style>
</head>
